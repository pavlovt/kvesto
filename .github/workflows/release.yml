name: Release

# Publishes every package in packages/* to npm when a version tag (v1.2.3) is pushed, or when run by hand
# on main (Actions > Release > Run workflow), then creates the GitHub release vX.Y.Z (and its tag) with the
# notes from CHANGELOG.md.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret, and npm adds provenance automatically.
# One-time setup per package on npmjs.com: Settings > Trusted publishing > GitHub Actions,
# repository pavlovt/kvesto, workflow release.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the GitHub release (and its tag when run by hand)
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Check the tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for f in packages/*/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "::error::$f is $v, tag is $GITHUB_REF_NAME"; exit 1; fi
          done

      # pnpm pack swaps workspace:* for real versions; npm publish then uses OIDC.
      - name: Pack
        run: |
          mkdir -p .release
          for d in schema core server kvesto editor dashboard react vue export; do (cd packages/$d && pnpm pack --pack-destination ../../.release); done
          ls -l .release

      - name: Publish (skips versions already on npm)
        run: |
          for d in schema core server kvesto editor dashboard react vue export; do
            name=$(node -p "require('./packages/$d/package.json').name")
            version=$(node -p "require('./packages/$d/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"; continue
            fi
            tag=latest; case "$version" in *-*) tag=next;; esac
            tarball=$(ls .release/$(echo "$name" | sed 's/^@//; s/\//-/')-$version.tgz)
            npm publish "$tarball" --access public --tag "$tag"
          done

      - name: Create the GitHub release (skips one that already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then echo "Release v$version exists, skipping"; exit 0; fi
          # The notes are the CHANGELOG.md section for this version.
          awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > .release/notes.md
          flags=""; case "$version" in *-*) flags="--prerelease";; esac
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file .release/notes.md $flags
