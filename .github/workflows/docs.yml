name: Docs

# Builds the documentation site (apps/docs) and the editor demo (apps/editor, under /demo) and deploys them to
# GitHub Pages at https://pavlovt.github.io/kvesto/.
# One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - apps/**
      - packages/**
      - ACCESSIBILITY.md
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=1 --filter "./packages/*" run build
      - run: pnpm --filter @kvesto/docs-app build
        env:
          BASE_PATH: /kvesto
      - run: pnpm --filter @kvesto/editor-app build
        env:
          BASE_PATH: /kvesto/demo
      - run: cp -r apps/editor/build apps/docs/build/demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
